          - Simplistic Behaviours for AI
        start_date: January 2026
        end_date: May 2026

      - name: Can a Compute Shader Octree Approach to Render Culling in Vulkan Increase Performance Compared to Traditional CPU-GPU Approach.
        summary: For my final year dissertation, I wanted to explore the different culling options and found that most would still go over every vertice an object had, so I thought if every object in a scene had this bounding box, calculated by the compute shader, then compared to the screen space coordinates, entire objects could be discarded instead increasing performance.
        highlights: 
          - Implementation of a Compute Shader
          - Discovering the Normalised Device Coordinates
          - Learning about Top- / Bottom-level Raytracing Acceleration Structures
        start_date: September 2025
        end_date: January 2026
